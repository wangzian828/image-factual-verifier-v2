[project]
name = "image-factual-verifier"
version = "4.0.0"
description = "Discrepancy-first multimodal image factual verification runtime"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "oss2>=2.18",
    "Pillow>=10.0",
    "scikit-image>=0.24,<0.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
ops = [
    "websocket-client>=1.6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"

[tool.pytest.ini_options]
# training/ is an independently installable Python project with its own test root.
# Root runtime gates deliberately do not import its package or mix dependencies.
norecursedirs = ["training"]
