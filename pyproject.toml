[project]
name = "image-factual-verifier"
version = "3.0.0"
description = "VisualFact-driven image factual verification runtime"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25.0",
    "requests>=2.28",
    "beautifulsoup4>=4.11",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "oss2>=2.18",
    "Pillow>=10.0",
    "easyocr>=1.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
ops = [
    "websocket-client>=1.6",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta:__legacy__"
