[project]
name = "image-factual-verifier"
version = "2.0.0"
description = "4-stage orchestrator for image factual verification"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
    "openai>=1.0",
    "requests>=2.28",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "Pillow>=10.0",
    "numpy>=1.24",
    # OCR
    "paddlepaddle>=3.0.0",
    "paddleocr>=2.9.1",
    # Face detection
    "insightface>=0.7.3",
    "onnxruntime>=1.19.0",
    "opencv-python-headless>=4.8",
    # Optional: relaxed JSON parsing
    "json5>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
