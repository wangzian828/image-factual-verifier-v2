project:
  title: "Search-agent training stack selection for IFV"
  question: "Which mature training stack best supports Qwen3.5 full-parameter SFT and multi-turn visual search-agent RL without coupling to the Gemini runtime?"
  status: active
  started: "2026-07-17"
  domain: "multimodal agent post-training"

literature:
  key_papers:
    - "StepSearch (2505.15107): gold support-document and search-key process rewards"
    - "TIPS (2603.22293): answer-likelihood potential shaping"
    - "LOTAPO (2607.13501): leave-one-turn counterfactual attribution"
    - "RewardFlow (2603.18859): state-graph reward propagation"
    - "CW-GRPO (2604.14267): LLM-judge contribution-weighted advantage redistribution"
    - "PRInTS (2511.19314): Monte-Carlo information-gain PRM and recursive context summary"
    - "FaithMed (2607.01440): Gemini step rubric rewards in GiGPO"
    - "TRACE (2607.13988): frozen-reference turn-level TD credit"
  open_problems:
    - "Few search-agent projects combine image-conditioned state, real web tools, evidence-chain rewards, and deterministic stopping."
    - "Repository claims often hide whether training is full-parameter, LoRA, or inference-only."
  evidence_gaps:
    - "Exact GPU and memory behavior for Qwen3-VL-8B full-parameter RL on 4xA100-40GB."
    - "Checkpoint/resume maturity for long-horizon multimodal tool environments."
    - "Human-calibrated agreement of one-call Gemini trajectory rankings with outcome and Evidence quality on IFV groups."

hypotheses:
  - id: H1
    statement: "Splitting full-parameter SFT onto ms-swift and agent RL onto a veRL-derived agent framework gives the best fit and lowest integration risk."
    status: supported
    motivation: "Qwen template/training maturity and long-horizon environment maturity may live in different ecosystems."
    parent: null
    priority: high
  - id: H2
    statement: "A single framework can cover both full-parameter Qwen3-VL SFT and search-agent RL without material loss of capability or maintainability."
    status: refuted
    motivation: "One stack would reduce environment and checkpoint complexity if its agent abstraction is sufficiently mature."
    parent: null
    priority: medium
  - id: H3
    statement: "Step-level MDP training maps more cleanly to IFV than token-level monolithic rollouts because the runtime already owns actions, observations, state reduction, and stopping."
    status: supported
    motivation: "The runtime has explicit semantic boundaries that should remain auditable during RL."
    parent: null
    priority: high
  - id: H4
    statement: "Calibrated turn-level process credit is necessary for the current IFV RL implementation."
    status: deferred
    motivation: "It has research precedent, but the current scope deliberately uses mature standard GRPO with one trajectory scalar and no custom advantage estimator."
    parent: null
    priority: high

experiments:
  proxy_metric: "Evidence-backed framework fit score over SFT, VLM, full-parameter, environment, reward, distributed, recovery, and integration criteria"
  baseline_value: null
  best_value: "split stack: ms-swift SFT + rLLM/veRL RL"
  total_runs: 4
  trajectory:
    - run_id: "survey_001"
      hypothesis: "H1"
      metric_value: "supported"
      delta: null
      wall_time_min: null
      change_summary: "Direct multimodal search projects independently split SFT and RL frameworks."
      timestamp: "2026-07-17"
    - run_id: "survey_002"
      hypothesis: "H2"
      metric_value: "refuted"
      delta: null
      wall_time_min: null
      change_summary: "Single-framework options either duplicate the runtime loop or lack direct VLM search precedent."
      timestamp: "2026-07-17"
    - run_id: "survey_003"
      hypothesis: "H3"
      metric_value: "supported"
      delta: null
      wall_time_min: null
      change_summary: "Gateway-captured independent LLM calls preserve IFV stage boundaries without rewriting the state machine."
      timestamp: "2026-07-17"
    - run_id: "survey_004"
      hypothesis: "H4"
      metric_value: "deferred"
      delta: null
      wall_time_min: null
      change_summary: "Expanded source audit found multiple released turn-credit implementations; retain as research evidence, not the current production algorithm."
      timestamp: "2026-07-22"
    - run_id: "decision_005"
      hypothesis: "H4"
      metric_value: "standard_grpo_trajectory_scalar"
      delta: null
      wall_time_min: null
      change_summary: "User decision: one blind Gemini comprehensive trajectory score, outcome-gated scalar reward, G=4 same-prompt groups, and framework-native GRPO normalization."
      timestamp: "2026-07-22"

outer_loop:
  cycle: 2
  last_direction: standard_grpo
  last_reflection: "Keep the split stack. Use one frozen Gemini comprehensive trajectory audit and outcome-gated scalar rewards in same-prompt groups; rLLM/veRL owns standard GRPO normalization and all policy tokens share the episode advantage."

workspace:
  findings: "findings.md"
  log: "research-log.md"
  literature_dir: "literature/"
  experiments_dir: "experiments/"
  to_human_dir: "to_human/"
  paper_dir: "paper/"
