project:
  title: Evidence-Triggered Visual Reinterpretation Diagnostic
  question: >
    Where does the unmodified discrepancy-first-v4 Agent first fail when external
    evidence could reveal a previously unmodeled, image-checkable visual distinction?
  status: active
  started: 2026-07-31
  domain: multimodal agent behavior diagnosis

baseline:
  runtime_policy: discrepancy-first-v4
  commit: 4729301
  prompts_modified: false
  schemas_modified: false
  reducers_modified: false
  visual_reinspection_budget_modified: false
  student_service:
    model: ifv-qwen3.5-9b
    endpoint: http://127.0.0.1:8901/v1
    physical_gpus: [4, 5]
    endpoint_gates: passed

hypotheses:
  H1:
    statement: >
      On at least some diagnostic cases, the existing Evidence-to-Vision path can
      retrieve a relevant fine-grained distinction, request a discriminative visual
      reinspection, and use the resulting pixel Evidence to change a subsequent
      Decision without any Agent modification.
    status: active
    priority: high
    prediction: >
      The complete chain need not appear on every case, but at least one of 5-10
      preselected diagnostic cases should reach a causally consequential post-
      reinspection Decision. Other cases should expose a reproducible earliest
      failure stage rather than an undifferentiated wrong verdict.

experiments:
  proxy_metric: complete_causal_closure_count_and_earliest_failure_stage
  baseline_value: null
  best_value: null
  total_runs: 0
  trajectory: []

diagnostic_stages:
  - knowledge_retrieval
  - image_checkable_distinction_recognition
  - reinspection_trigger
  - discriminative_question_and_region
  - visual_observation
  - downstream_state_consumption
  - causal_decision_impact

decision_rule: >
  Do not add an interpretation state unless a case reaches a correct visual
  observation but the subsequent policy continues to consume the old interpretation.
  Repair only the earliest recurring failure stage.

outer_loop:
  cycle: 0
  last_direction: null
  last_reflection: ""

workspace:
  diagnostic_plan: ../evidence-triggered-reinterpretation-diagnostic-plan-2026-07-29.md
  findings: findings.md
  log: research-log.md
  experiments_dir: experiments/
  candidate_table: data/candidate-cases.md

