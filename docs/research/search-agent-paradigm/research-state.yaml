project:
  title: "Search Agent 范式与单图事实核查研究"
  question: "当前 Search Agent 尤其是开放域多模态、证据驱动的单图事实核查 Agent 面临哪些关键问题，前沿工作如何解决，下一步最值得研究什么？"
  status: concluded
  started: "2026-07-10"
  domain: "search agents, multimodal fact-checking, evidence-grounded agents"

scope:
  primary_years: "2023-2026"
  foundational_work: true
  source_policy: "优先论文原文、官方项目页和机构技术报告；关键论断至少一条原始来源；区分论文证据、厂商声明和本文综合判断。"

literature:
  key_papers:
    - id: react
      title: "ReAct: Synergizing Reasoning and Acting in Language Models"
      year: 2022
      relevance: "检索—推理交错的奠基范式"
    - id: mindsearch
      title: "MindSearch: Mimicking Human Minds Elicits Deep AI Searcher"
      year: 2024
      relevance: "动态图规划与并行搜索"
    - id: deepresearcher
      title: "DeepResearcher: Scaling Deep Research via Reinforcement Learning in Real-world Environments"
      year: 2025
      relevance: "真实网页环境端到端 RL"
    - id: defame
      title: "DEFAME: Dynamic Evidence-based FAct-checking with Multimodal Experts"
      year: 2024
      relevance: "动态多工具开放域多模态核查"
    - id: averimatec
      title: "AVerImaTeC: A Dataset for Automatic Verification of Image-Text Claims with Evidence from the Web"
      year: 2025
      relevance: "最贴近目标任务的数据与证据评测"
    - id: seekergym
      title: "SeekerGym: A Benchmark for Reliable Information Seeking"
      year: 2026
      relevance: "完整性与漏证不确定性"
    - id: cited_not_verified
      title: "Cited but Not Verified: Parsing and Evaluating Source Attribution in LLM Deep Research Agents"
      year: 2026
      relevance: "引用可访问、相关与事实支持的分离审计"
  open_problems:
    - "任务分解、动态重规划与停止条件缺乏可验证语义"
    - "开放网页证据的相关性、可信度、独立性和时效性难以联合优化"
    - "引用存在不支持结论、断章取义和覆盖不足"
    - "视觉内容、来源、上下文和传播链真实性被混为单一标签"
    - "失败与不可核验状态常被语言流畅性掩盖"
  evidence_gaps: []

hypotheses:
  - id: H1
    statement: "Search Agent 的主要瓶颈已从单步检索转向可验证的证据闭环与停止/拒答决策。"
    status: supported
    priority: high
  - id: H2
    statement: "单图事实核查需要对象级、声明级和证据来源级的三层账本，单一端到端轨迹不足以保证结论。"
    status: supported
    priority: high
  - id: H3
    statement: "确定性覆盖约束若不同时建模证据独立性、冲突与质量，会产生形式覆盖而非实质覆盖。"
    status: supported
    priority: high

experiments:
  proxy_metric: "文献覆盖、引用可核验率、问题—解法—缺口映射完整度"
  baseline_value: null
  best_value: null
  total_runs: 0
  trajectory: []

outer_loop:
  cycle: 1
  last_direction: deepen
  last_reflection: "将研究方向聚焦于 quality- and independence-aware coverage constraints、claim-level provenance、失败保真和校准拒答。"

workspace:
  findings: "findings.md"
  log: "research-log.md"
  literature_dir: "literature/"
  data_dir: "data/"
  to_human_dir: "to_human/"
