dataset_version: ifv-trajectory-sft-dataset-v1
trajectory_version: ifv-trajectory-sft-v1
tokenizer_adapter: utf8-byte-v1
split:
  train: 0.8
  validation: 0.1
  test: 0.1
grouping:
  - episode_id
  - source_family
required_audits:
  - no_evaluator_private_leakage
  - runtime_references_resolvable
  - loss_masks_aligned
  - episodes_do_not_cross_splits
  - source_families_do_not_cross_splits
quality_gate:
  require_correct_result: true
  require_complete_visual_bridge: true
  minimum_verdict_basis_alignment: 0.8
  require_minimal_verdict_basis: true
  maximum_semantic_duplicate_actions: 0
  maximum_post_determination_actions: 0
  maximum_low_value_actions: 1
  require_valid_findings: true
  maximum_unresolved_evidence_conflicts: 0
  preserve_excluded_episode_metadata: true
training_scope:
  format: one_complete_episode_per_row
  tool_responses: context_only_loss_mask_zero
  assistant_and_tool_calls: supervised_targets
  long_trajectories: long_holdout_jsonl
training_enabled: false
