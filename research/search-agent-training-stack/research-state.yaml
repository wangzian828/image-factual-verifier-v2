project:
  title: "Search-agent training stack selection for IFV"
  question: "Which mature training stack best supports Qwen3-VL full-parameter SFT and multi-turn visual search-agent RL without coupling to the Gemini runtime?"
  status: active
  started: "2026-07-17"
  domain: "multimodal agent post-training"

literature:
  key_papers: []
  open_problems:
    - "Few search-agent projects combine image-conditioned state, real web tools, evidence-chain rewards, and deterministic stopping."
    - "Repository claims often hide whether training is full-parameter, LoRA, or inference-only."
  evidence_gaps:
    - "Exact GPU and memory behavior for Qwen3-VL-8B full-parameter RL on 4xA100-40GB."
    - "Checkpoint/resume maturity for long-horizon multimodal tool environments."

hypotheses:
  - id: H1
    statement: "Splitting full-parameter SFT onto ms-swift and agent RL onto a veRL-derived agent framework gives the best fit and lowest integration risk."
    status: supported
    motivation: "Qwen template/training maturity and long-horizon environment maturity may live in different ecosystems."
    parent: null
    priority: high
  - id: H2
    statement: "A single framework can cover both full-parameter Qwen3-VL SFT and search-agent RL without material loss of capability or maintainability."
    status: refuted
    motivation: "One stack would reduce environment and checkpoint complexity if its agent abstraction is sufficiently mature."
    parent: null
    priority: medium
  - id: H3
    statement: "Step-level MDP training maps more cleanly to IFV than token-level monolithic rollouts because the runtime already owns actions, observations, state reduction, and stopping."
    status: supported
    motivation: "The runtime has explicit semantic boundaries that should remain auditable during RL."
    parent: null
    priority: high

experiments:
  proxy_metric: "Evidence-backed framework fit score over SFT, VLM, full-parameter, environment, reward, distributed, recovery, and integration criteria"
  baseline_value: null
  best_value: "split stack: ms-swift SFT + rLLM/veRL RL"
  total_runs: 3
  trajectory:
    - run_id: "survey_001"
      hypothesis: "H1"
      metric_value: "supported"
      delta: null
      wall_time_min: null
      change_summary: "Direct multimodal search projects independently split SFT and RL frameworks."
      timestamp: "2026-07-17"
    - run_id: "survey_002"
      hypothesis: "H2"
      metric_value: "refuted"
      delta: null
      wall_time_min: null
      change_summary: "Single-framework options either duplicate the runtime loop or lack direct VLM search precedent."
      timestamp: "2026-07-17"
    - run_id: "survey_003"
      hypothesis: "H3"
      metric_value: "supported"
      delta: null
      wall_time_min: null
      change_summary: "Gateway-captured independent LLM calls preserve IFV stage boundaries without rewriting the state machine."
      timestamp: "2026-07-17"

outer_loop:
  cycle: 1
  last_direction: deepen
  last_reflection: "Adopt a split stack. Validate rLLM gateway protocol and gpu13 memory before freezing the RL backend; keep OpenRLHF as fallback."

workspace:
